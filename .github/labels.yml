#
# The repository's labels. .github/scripts/sync-labels.sh creates or updates
# each one on GitHub; labels not listed here are left alone, and `renamedFrom`
# carries GitHub's default labels over without losing what they are on.

# Type: what kind of change or report. One per issue or pull request.
- name: "type: bug"
  color: "d73a4a"
  description: "Something is wrong, broken or misleading"
  renamedFrom: "bug"
- name: "type: feature"
  color: "a2eeef"
  description: "A new capability or a change in behaviour"
  renamedFrom: "enhancement"
- name: "type: performance"
  color: "fbca04"
  description: "Speed, memory, CPU, wakeups or size"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
  renamedFrom: "documentation"
- name: "type: tests"
  color: "c5def5"
  description: "Tests only"
- name: "type: data"
  color: "bfd4f2"
  description: "Prices, model aliases or the comparison corpus"
- name: "type: tooling"
  color: "d4c5f9"
  description: "Build, CI, scripts or repository setup"
- name: "type: question"
  color: "d876e3"
  description: "A question rather than a change"
  renamedFrom: "question"

# Area: which part of Burnline. As many as apply.
- name: "area: ingestion"
  color: "1d76db"
  description: "Reading provider files into the database"
- name: "area: quota"
  color: "1d76db"
  description: "Limits, resets, banked resets and burn rate"
- name: "area: pricing"
  color: "1d76db"
  description: "Cost, price selection and the price manifest"
- name: "area: store"
  color: "1d76db"
  description: "The database: schema, migrations, rollups, compaction"
- name: "area: notifications"
  color: "1d76db"
  description: "Alerts and their delivery"
- name: "area: activity"
  color: "1d76db"
  description: "Streaks, achievements and comparisons"
- name: "area: menu bar"
  color: "1d76db"
  description: "The menu-bar label and popover"
- name: "area: dashboard"
  color: "1d76db"
  description: "The dashboard window and its pages"
- name: "area: settings"
  color: "1d76db"
  description: "Onboarding, Settings and data controls"
- name: "area: privacy"
  color: "1d76db"
  description: "What is read, stored or sent"

# Provider: when one provider is involved.
- name: "provider: claude code"
  color: "cc7c5e"
  description: "Claude Code"
- name: "provider: codex"
  color: "b8c4d0"
  description: "OpenAI Codex"
- name: "provider: new"
  color: "e99695"
  description: "Supporting a provider Burnline does not read yet"

# Status: where an issue or pull request stands.
- name: "status: needs triage"
  color: "ededed"
  description: "Not yet looked at by a maintainer"
- name: "status: needs info"
  color: "fef2c0"
  description: "Waiting on the author for details or a reproduction"
- name: "status: approved"
  color: "0e8a16"
  description: "Direction and scope agreed; a pull request is welcome"
- name: "status: blocked"
  color: "b60205"
  description: "Waiting on something else"
- name: "status: declined"
  color: "ffffff"
  description: "Will not be done"
  renamedFrom: "wontfix"
- name: "status: duplicate"
  color: "cfd3d7"
  description: "Already reported or proposed"
  renamedFrom: "duplicate"
- name: "status: invalid"
  color: "e4e669"
  description: "Not a problem with Burnline, or not reproducible"
  renamedFrom: "invalid"

# Pull requests: what a reviewer needs to know at a glance.
- name: "tests: not covered"
  color: "f9d0c4"
  description: "Declares behaviour the tests do not check; needs manual evidence"
- name: "ai assisted"
  color: "c2e0c6"
  description: "Code written or changed with an AI model, named in the pull request"
- name: "breaking: data"
  color: "b60205"
  description: "Adds a migration or changes stored data"

# Community.
- name: "good first issue"
  color: "7057ff"
  description: "Small and well defined; good for a first contribution"
- name: "help wanted"
  color: "008672"
  description: "A pull request for this is welcome"
- name: "accessibility"
  color: "f143ab"
  description: "A barrier for people with disabilities"
- name: "security"
  color: "b60205"
  description: "Security-relevant; report vulnerabilities privately"
