#
# The checks every pull request must pass. Scope looks at what changed: a pull
# request that only touches documentation (Markdown, and the README's images)
# skips the two macOS jobs. Otherwise they run side by side:
#
# - Tests and build: the test suite, license headers, the coverage floor and a
#   build of the app. Each step runs even when an earlier one failed, so one
#   report says everything that needs fixing.
# - Performance: the performance suites on the pull request and on its base
#   branch, on the same runner, against the budgets in docs/performance.md.
#
# Then Checks, the status branch rules require, writes one report from both
# and uploads it for `ci-report.yml`, which posts it on the pull request. This
# workflow runs the pull request's code, so it is given no permission to write.

name: CI

on:
  pull_request:
    branches: [main, "staging-build-*", nightly]
  push:
    branches: [nightly]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PACKAGES: macos/Packages
  LOGS: ${{ github.workspace }}/ci-logs

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # "false" when every changed file is documentation, so no check could
      # change its result.
      code: ${{ steps.scope.outputs.code }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what to check
        id: scope
        run: |
          # A push to nightly has no base: always check.
          if [ -z "$BASE_SHA" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$changed"
          # Markdown anywhere, and the images the README and docs show.
          others=$(echo "$changed" | grep -v -E '(\.md$|^docs/images/)' || true)
          if [ -n "$changed" ] && [ -z "$others" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests and build
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      tests: ${{ steps.tests.outcome }}
      headers: ${{ steps.headers.outcome }}
      coverage: ${{ steps.coverage.outcome }}
      app: ${{ steps.app.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # The package needs Swift tools 6.2, which ship with Xcode 26.
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          mkdir -p "$LOGS"
          { xcodebuild -version; swift --version; } | tee "$LOGS/toolchain.log"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PACKAGES }}/.build
          key: spm-debug-${{ runner.os }}-${{ hashFiles('macos/Packages/Package.resolved', 'macos/Packages/Package.swift') }}
          restore-keys: spm-debug-${{ runner.os }}-

      - name: Test suite
        id: tests
        continue-on-error: true
        env:
          # At most six tests at once, twice the runner's three cores. Left
          # unbounded, every test is in flight together and timing-sensitive
          # ones starve: tests taking milliseconds took thirty seconds.
          SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: 6
          # A run that prints nothing this long has hung: it is sampled and
          # stopped, rather than waiting out the job's limit.
          STALL_SECONDS: 300
        timeout-minutes: 20
        run: .github/scripts/watch_tests.sh "$LOGS/tests.log" swift test --package-path "$PACKAGES" --enable-code-coverage

      - name: License headers
        id: headers
        continue-on-error: true
        run: |
          set -o pipefail
          macos/scripts/check-license-headers.sh 2>&1 | tee "$LOGS/headers.log"

      - name: Coverage floor
        id: coverage
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          macos/scripts/coverage.sh --no-run --check 2>&1 | tee "$LOGS/coverage.log"

      - name: App build
        id: app
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project macos/Burnline.xcodeproj -scheme Burnline -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$LOGS/app.log" | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$LOGS/app.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-tests
          path: ci-logs/
          retention-days: 14

      - name: Fail if any check failed
        if: always()
        run: |
          for outcome in "${{ steps.tests.outcome }}" "${{ steps.headers.outcome }}" \
                         "${{ steps.coverage.outcome }}" "${{ steps.app.outcome }}"; do
            [ "$outcome" = failure ] && exit 1
          done
          exit 0

  performance:
    name: Performance
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      # "unaffected" when nothing that could change speed changed. Otherwise
      # the gate runs only when the build and measurements did, so a gate
      # that did not succeed is a failure, never "not run".
      perf: >-
        ${{ steps.scope.outputs.measure == 'false' && 'unaffected'
            || (steps.gate.outcome == 'success' && 'success' || 'failure') }}
    env:
      PERF: ${{ github.workspace }}/perf
      # Inside the workspace, so the cached base build has the same path on
      # every run.
      BASE: ${{ github.workspace }}/.base
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # What the base's compiled suites are cached as: built once per base
      # commit, then reused by every later push to a pull request against it.
      BASE_BUILT: .build/arm64-apple-macosx/release
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to measure
        id: scope
        run: |
          mkdir -p "$LOGS"
          # A push to nightly has no base: always measure.
          if [ -z "$BASE_SHA" ]; then echo "measure=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch --depth=1 origin "$BASE_SHA"
          # The package, the shared schema and data, and the gate itself.
          if git diff --name-only "$BASE_SHA" HEAD \
              | grep -qE '^(macos/Packages/|shared/|\.github/workflows/ci\.yml$|\.github/scripts/perf_compare\.py$)'; then
            echo "measure=true" >> "$GITHUB_OUTPUT"
          else
            echo "measure=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        id: xcode
        if: steps.scope.outputs.measure == 'true'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          echo "version=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: steps.scope.outputs.measure == 'true'
        with:
          path: ${{ env.PACKAGES }}/.build
          key: spm-release-${{ runner.os }}-${{ hashFiles('macos/Packages/Package.resolved', 'macos/Packages/Package.swift') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Check out the base branch
        id: base
        if: steps.scope.outputs.measure == 'true' && github.event_name == 'pull_request'
        run: |
          git worktree add --detach "$BASE" "$BASE_SHA"
          # Compare only when the base has the suites; until then, budgets only.
          if [ -f "$BASE/$PACKAGES/Tests/BurnlineStoreTests/StorePerformanceTests.swift" ]; then
            echo "compare=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the base's build
        id: base-build
        if: steps.base.outputs.compare == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.BASE }}/${{ env.PACKAGES }}/${{ env.BASE_BUILT }}/*.xctest
            ${{ env.BASE }}/${{ env.PACKAGES }}/${{ env.BASE_BUILT }}/*.bundle
            ${{ env.BASE }}/${{ env.PACKAGES }}/${{ env.BASE_BUILT }}/*.framework
          key: perf-base-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.BASE_SHA }}

      - name: Build
        if: steps.scope.outputs.measure == 'true'
        run: |
          # `swift test` builds with testing enabled, which the suites need;
          # without BURNLINE_PERF they skip, so this only builds.
          set -o pipefail
          build() { swift test -c release --package-path "$1" --filter PerformanceTests 2>&1 | tail -n 20; }
          build "$PACKAGES" | tee "$LOGS/perf-build.log"
          if [ "${{ steps.base.outputs.compare }}" = true ] && [ "${{ steps.base-build.outputs.cache-hit }}" != true ]; then
            build "$BASE/$PACKAGES"
          fi

      - name: Keep the base's build
        if: steps.base.outputs.compare == 'true' && steps.base-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.BASE }}/${{ env.PACKAGES }}/${{ env.BASE_BUILT }}/*.xctest
            ${{ env.BASE }}/${{ env.PACKAGES }}/${{ env.BASE_BUILT }}/*.bundle
            ${{ env.BASE }}/${{ env.PACKAGES }}/${{ env.BASE_BUILT }}/*.framework
          key: perf-base-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.BASE_SHA }}

      - name: Measure
        if: steps.scope.outputs.measure == 'true'
        run: |
          # Base and pull request take turns, three times, so a slow minute on the
          # runner falls on both; the best run of each counts.
          measure() {
            BURNLINE_PERF="$PERF/$2" swift test -c release --skip-build --no-parallel \
              --package-path "$1" --filter PerformanceTests 2>&1 | tee -a "$LOGS/perf.log" | grep -E "^PERF|✘" || true
          }
          for round in 1 2 3; do
            if [ "${{ steps.base.outputs.compare }}" = true ]; then measure "$BASE/$PACKAGES" "base-$round"; fi
            measure "$PACKAGES" "head-$round"
          done

      - name: Performance gate
        id: gate
        if: steps.scope.outputs.measure == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          bases=$(ls -d "$PERF"/base-* 2>/dev/null || true)
          python3 .github/scripts/perf_compare.py --head "$PERF"/head-* ${bases:+--base $bases} \
            --out "$LOGS/perf-result.json" 2>&1 | tee "$LOGS/perf-gate.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-perf
          path: ci-logs/
          retention-days: 14

      - name: Fail if the gate failed
        if: always() && steps.scope.outputs.measure == 'true'
        run: test "${{ steps.gate.outcome }}" != failure

  checks:
    name: Checks
    needs: [scope, tests, performance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v4
        with:
          pattern: logs-*
          path: ci-logs
          merge-multiple: true

      - name: Write the report
        env:
          # A job that never finished reports nothing; count that as a failure.
          TESTS: ${{ needs.tests.outputs.tests || 'failure' }}
          HEADERS: ${{ needs.tests.outputs.headers || 'failure' }}
          COVERAGE: ${{ needs.tests.outputs.coverage || 'skipped' }}
          APP: ${{ needs.tests.outputs.app || 'failure' }}
          PERF: ${{ needs.performance.outputs.perf || 'failure' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCS_ONLY: ${{ needs.scope.outputs.code == 'false' }}
        run: |
          mkdir -p ci-logs ci-report
          python3 .github/scripts/ci_report.py ci-logs ci-report
          cat ci-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report/
          retention-days: 14

      - name: Fail if any check failed
        run: |
          test "${{ needs.scope.result }}" = success
          # Documentation only: the macOS jobs were skipped on purpose.
          if [ "${{ needs.scope.outputs.code }}" = false ]; then exit 0; fi
          test "${{ needs.tests.result }}" = success && test "${{ needs.performance.result }}" = success
